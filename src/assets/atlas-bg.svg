<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14473F"/>
      <stop offset="0.55" stop-color="#0F2F2B"/>
      <stop offset="1" stop-color="#0B1F1B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#E3AE3C" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E3AE3C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.75" r="0.55">
      <stop offset="0" stop-color="#B83A52" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#B83A52" stop-opacity="0"/>
    </radialGradient>
    <!-- Восьмиконечная звезда (риб-эль-хизб) — классический узор самаркандских майолик -->
    <pattern id="star" width="120" height="120" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#E3AE3C" stroke-width="1.6" stroke-linejoin="miter">
        <rect x="22" y="22" width="76" height="76"/>
        <rect x="22" y="22" width="76" height="76" transform="rotate(45 60 60)"/>
        <circle cx="60" cy="60" r="14" stroke="#2F9A98" stroke-width="2"/>
      </g>
      <g fill="#B83A52" opacity="0.85">
        <polygon points="60,50 70,60 60,70 50,60"/>
        <polygon points="0,-9 9,0 0,9 -9,0"/>
        <polygon points="120,-9 129,0 120,9 111,0"/>
        <polygon points="0,111 9,120 0,129 -9,120"/>
        <polygon points="120,111 129,120 120,129 111,120"/>
      </g>
      <g fill="none" stroke="#F4EEDB" stroke-width="0.8" opacity="0.5">
        <path d="M0 60H22M98 60H120M60 0V22M60 98V120"/>
      </g>
    </pattern>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="4" fill="#fff" opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="720" height="1080" fill="url(#base)"/>
  <rect width="720" height="1080" fill="url(#star)" opacity="0.55"/>
  <rect width="720" height="1080" fill="url(#glow)"/>
  <rect width="720" height="1080" fill="url(#glow2)"/>
  <rect width="720" height="1080" fill="url(#grain)"/>
</svg>
